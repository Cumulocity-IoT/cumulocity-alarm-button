<c8y-modal [title]="title" (onClose)="onDone()" (onDismiss)="onDismiss()" [labels]="labels"
  [headerClasses]="'modal-header dialog-header'">
  <div class="p-24 modal-inner-scroll animated fadeIn">
    <!-- <div class="modal-body"> -->
    <c8y-form-group>
      <label>Alarm Reason, you can use {{'$'}}{{'{'}}iso_string{{'}'}} or {{'$'}}{{'{'}}timestamp{{'}'}} as
        variables</label>
      <textarea style="width: 100%" [(ngModel)]="alarm.text" name="text" [required]="true"></textarea>
    </c8y-form-group>
    <c8y-form-group>
      <label>Alarm Type</label>
      <input style="width: 100%" placeholder="e.g. c8y_BreakdownAlarmType" [(ngModel)]="alarm.type" name="type"
        [required]="true" />
    </c8y-form-group>
    <c8y-form-group>
      <label class="text-truncate" [title]="'Severity'">
        {{ "Alarm Severity" }}
      </label>
      <c8y-select [items]="severities" [(ngModel)]="alarm.severity" name="severity" [filterItems]="false"
        container="body" placeholder="Select severity..." aria-label="Alarm Severity">
      </c8y-select>
    </c8y-form-group>
    <!-- </div> -->
  </div>
</c8y-modal>
